# Written to /etc/nginx/conf.d/taiga-back.conf by railway-start.sh (PORT filled in).
server {
    listen [::]:__PORT__ ipv6only=off default_server;

    client_max_body_size 100M;
    charset utf-8;

    # Railway health check: answers once gunicorn is up.
    location = /healthz {
        proxy_pass http://127.0.0.1:8001/api/v1/;
        proxy_set_header Host $http_host;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $scheme;
        proxy_redirect off;
        proxy_read_timeout 300s;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $scheme;
        proxy_redirect off;
    }

    location /static/ {
        alias /taiga-back/static/;
    }

    # Files taiga-protected has approved (X-Accel-Redirect).
    location /_protected/ {
        internal;
        alias /taiga-back/media/;
        add_header Content-disposition "attachment";
    }

    location /media/exports/ {
        alias /taiga-back/media/exports/;
        add_header Content-disposition "attachment";
    }

    # Every other media file: taiga-protected checks the signed token first.
    location /media/ {
        resolver __RESOLVER__ valid=30s;
        set $protected __PROTECTED_HOST__;
        rewrite ^/media/(.*)$ /$1 break;
        proxy_pass http://$protected:8003;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
    }
}
